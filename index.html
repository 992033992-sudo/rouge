<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>金币工坊：Coin Rogue</title>
<style>
body{margin:0;background:#0b1120;color:#e8f1ff;font-family:Arial}#menu,#game{min-height:100vh;display:none}#menu.active,#game.active{display:flex}
#menu{align-items:center;justify-content:center;flex-direction:column;gap:12px}#game{padding:16px;gap:12px}#panel{width:280px;background:#1a2438;border-radius:10px;padding:12px}
button{background:#72d8ff;border:0;padding:10px 16px;border-radius:8px;font-weight:700;cursor:pointer}canvas{background:#0a1322;border:2px solid #2f4263;border-radius:12px}
</style>
</head>
<body>
<section id="menu" class="active"><h1>金币工坊：Coin Rogue</h1><button id="start">开始</button></section>
<section id="game"><div id="panel"><h3>Debug</h3><div id="ui"></div></div><canvas id="cv" width="920" height="640"></canvas></section>
<script>
const boardXMin=80,boardXMax=720,boardYBack=120,boardYFront=520,collectLineY=540;
class Coin{constructor(x,y){this.x=x;this.y=y;this.vx=0;this.vy=0;this.radius=12;this.value=10;this.collected=false;this.settled=false;}}
class Game{
  constructor(){this.cv=document.getElementById('cv');this.ctx=this.cv.getContext('2d');this.coins=[];this.score=0;this.spawnerX=(boardXMin+boardXMax)/2;this.floatTexts=[];this.pusher={y:boardYBack,min:boardYBack,max:boardYBack+110,thickness:24,dir:1,speedF:100,speedB:60,pushForce:180};this.bind();this.updateUI();}
  bind(){this.cv.addEventListener('mousemove',e=>{const r=this.cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*this.cv.width;this.spawnerX=Math.max(boardXMin+20,Math.min(boardXMax-20,x));});this.cv.addEventListener('click',()=>this.dropCoin());window.addEventListener('keydown',e=>{if(e.key===' ')this.dropCoin();});}
  dropCoin(){const coin=new Coin(this.spawnerX,boardYBack+20);this.coins.push(coin);console.log('coin spawned, no score');}
  updatePusher(dt){const p=this.pusher;const speed=p.dir>0?p.speedF:p.speedB;p.y+=p.dir*speed*dt;if(p.y>=p.max){p.y=p.max;p.dir=-1}else if(p.y<=p.min){p.y=p.min;p.dir=1}}
  applyPusherForce(dt){if(this.pusher.dir<=0)return;for(const c of this.coins){if(c.collected)continue;if(c.y<this.pusher.y+this.pusher.thickness&&c.y>this.pusher.y-c.radius){c.vy+=this.pusher.pushForce*dt;console.log('pusher pushing coin');}}}
  updateCoins(dt){for(const c of this.coins){c.vy+=30*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.vx*=0.985;c.vy*=0.992;if(Math.abs(c.vy)<1)c.settled=true;if(c.x<boardXMin+c.radius){c.x=boardXMin+c.radius;c.vx=Math.abs(c.vx)*0.25}if(c.x>boardXMax-c.radius){c.x=boardXMax-c.radius;c.vx=-Math.abs(c.vx)*0.25}if(c.y<boardYBack+c.radius){c.y=boardYBack+c.radius;c.vy=0}}}
  resolveCollisions(){for(let i=0;i<this.coins.length;i++)for(let j=i+1;j<this.coins.length;j++){const a=this.coins[i],b=this.coins[j];if(a.collected||b.collected)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||0.001,min=a.radius+b.radius;if(d<min){const nx=dx/d,ny=dy/d,ov=min-d;a.x-=nx*ov*0.5;a.y-=ny*ov*0.5;b.x+=nx*ov*0.5;b.y+=ny*ov*0.5;const k=16;a.vx-=nx*k;a.vy-=ny*k;b.vx+=nx*k;b.vy+=ny*k;}}}
  collectCoins(){for(const c of this.coins){if(c.y>collectLineY&&!c.collected){c.collected=true;this.score+=c.value;this.floatTexts.push({x:c.x,y:c.y,t:`+${c.value}`,life:1});console.log('coin collected, score +10');this.updateUI();}}this.coins=this.coins.filter(c=>!c.collected)}
  updateUI(){document.getElementById('ui').innerHTML=`分数: ${this.score}<br>硬币数: ${this.coins.length}<br>推板Y: ${this.pusher.y.toFixed(1)}<br>collectLineY: ${collectLineY}`}
  worldToScreen(x,y){const t=(y-boardYBack)/(boardYFront-boardYBack);const topW=380,bottomW=700,cx=460,topY=120,bottomY=520;const w=topW+(bottomW-topW)*Math.max(0,Math.min(1,t));return{x:cx+(x-(boardXMin+boardXMax)/2)/(boardXMax-boardXMin)*w,y:topY+(bottomY-topY)*Math.max(0,Math.min(1,t)),s:0.55+Math.max(0,Math.min(1,t))*0.7}}
  drawMachine(){const c=this.ctx;c.clearRect(0,0,this.cv.width,this.cv.height);c.fillStyle='#0e1a30';c.fillRect(0,0,this.cv.width,this.cv.height);const bl=this.worldToScreen(boardXMin,boardYBack),br=this.worldToScreen(boardXMax,boardYBack),fl=this.worldToScreen(boardXMin,boardYFront),fr=this.worldToScreen(boardXMax,boardYFront);
    c.fillStyle='#1a2d49';c.beginPath();c.moveTo(bl.x,bl.y);c.lineTo(br.x,br.y);c.lineTo(fr.x,fr.y);c.lineTo(fl.x,fl.y);c.closePath();c.fill();
    c.fillStyle='#0a0d14';c.beginPath();c.moveTo(fl.x+24,fl.y+8);c.lineTo(fr.x-24,fr.y+8);c.lineTo(fr.x-40,600);c.lineTo(fl.x+40,600);c.closePath();c.fill();
    c.strokeStyle='#8fe0ff77';c.lineWidth=4;c.strokeRect(bl.x-45,bl.y-55,(br.x-bl.x)+90,510);
    c.strokeStyle='red';c.lineWidth=2;c.beginPath();c.moveTo(0,collectLineY);c.lineTo(this.cv.width,collectLineY);c.stroke();
  }
  drawPusher(){const c=this.ctx,y=this.pusher.y,l=this.worldToScreen(boardXMin+10,y),r=this.worldToScreen(boardXMax-10,y),l2=this.worldToScreen(boardXMin+10,y+26),r2=this.worldToScreen(boardXMax-10,y+26);c.fillStyle=this.pusher.dir>0?'#a9bad0':'#6e819d';c.beginPath();c.moveTo(l.x,l.y);c.lineTo(r.x,r.y);c.lineTo(r2.x,r2.y);c.lineTo(l2.x,l2.y);c.closePath();c.fill();}
  drawCoins(){const arr=[...this.coins].sort((a,b)=>a.y-b.y);for(const coin of arr){const p=this.worldToScreen(coin.x,coin.y),r=coin.radius*p.s,c=this.ctx;c.fillStyle='rgba(0,0,0,.28)';c.beginPath();c.ellipse(p.x,p.y+r*0.75,r*0.9,r*0.3,0,0,Math.PI*2);c.fill();c.fillStyle='#b9791c';c.beginPath();c.ellipse(p.x,p.y+r*0.25,r,r*0.35,0,0,Math.PI*2);c.fill();const g=c.createRadialGradient(p.x-r*0.2,p.y-r*0.3,1,p.x,p.y,r*1.2);g.addColorStop(0,'#fff8bf');g.addColorStop(1,'#e0a42a');c.fillStyle=g;c.beginPath();c.ellipse(p.x,p.y-r*0.12,r,r*0.76,0,0,Math.PI*2);c.fill();}}
  drawSpawner(){const c=this.ctx,p=this.worldToScreen(this.spawnerX,boardYBack);c.fillStyle='#8ad9ff';c.fillRect(p.x-16,p.y-44,32,34);c.fillStyle='#1f334a';c.fillRect(p.x-20,p.y-12,40,12)}
  drawFloat(){const c=this.ctx;for(const f of this.floatTexts){f.life-=1/60;f.y-=0.8;c.globalAlpha=Math.max(0,f.life);c.fillStyle='#8dff91';c.font='bold 18px Arial';c.fillText(f.t,f.x,f.y)}c.globalAlpha=1;this.floatTexts=this.floatTexts.filter(f=>f.life>0)}
  update(dt){this.updatePusher(dt);this.applyPusherForce(dt);this.updateCoins(dt);this.resolveCollisions();this.collectCoins();this.updateUI()}
  draw(){this.drawMachine();this.drawPusher();this.drawCoins();this.drawSpawner();this.drawFloat()}
  loop(ts){if(!this.last)this.last=ts;const dt=Math.min((ts-this.last)/1000,0.033);this.last=ts;this.update(dt);this.draw();requestAnimationFrame(t=>this.loop(t))}
}
let g;document.getElementById('start').onclick=()=>{document.getElementById('menu').classList.remove('active');document.getElementById('game').classList.add('active');g=new Game();requestAnimationFrame(t=>g.loop(t));}
</script>
</body>
</html>

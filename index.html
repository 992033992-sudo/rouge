<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>金币工坊：Coin Rogue</title>
<style>
:root{--bg:#090d16;--panel:#1c2333;--text:#e8f1ff;--accent:#6ed8ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#1d2740 0,#090d16 55%);color:var(--text);font-family:Arial}
.screen{display:none;min-height:100vh;padding:18px}.screen.active{display:flex}.menu{flex-direction:column;align-items:center;justify-content:center;gap:12px}
.game{display:grid;grid-template-columns:310px 1fr;gap:14px}.panel{background:var(--panel);padding:12px;border-radius:10px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{background:var(--accent);border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}canvas{width:100%;max-width:980px;background:#09101e;border:2px solid #2a3a54;border-radius:12px}
.small{font-size:12px;opacity:.85}
</style>
</head>
<body>
<section id="menuScreen" class="screen menu active">
  <h1>金币工坊：Coin Rogue</h1><button id="startBtn">开始游戏</button><p class="small">鼠标左右移动投币口，点击/空格投币，D 切换调试线。</p>
</section>
<section id="gameScreen" class="screen game">
  <div class="panel"><h3>推币机状态</h3><div class="stats" id="stats"></div><p class="small">核心闭环：投币 → 推动 → 掉落 → 得分</p></div>
  <canvas id="gameCanvas" width="980" height="640"></canvas>
</section>
<script>
class Coin{
  constructor(x,y){this.x=x;this.y=y;this.vx=(Math.random()-0.5)*10;this.vy=12;this.radius=13;this.value=10;this.collected=false}
}
class CoinSpawner{
  constructor(gm){this.gm=gm;this.x=0}
  drop(){if(!this.gm.canDrop())return;const c=new Coin(this.x,0.08);this.gm.coins.push(c);this.gm.remainingCoins--;this.gm.updateUI()}
}
class Pusher{
  constructor(gm){this.gm=gm;this.minY=.10;this.maxY=.30;this.y=this.minY;this.dir=1;this.speedF=0.24;this.speedB=0.14;this.lastY=this.y;this.pushingForward=true;this.contactWidth=0.92;this.pushForce=130}
  update(dt){this.lastY=this.y;const speed=this.dir>0?this.speedF:this.speedB;this.y+=this.dir*speed*dt;if(this.y>=this.maxY){this.y=this.maxY;this.dir=-1}else if(this.y<=this.minY){this.y=this.minY;this.dir=1}this.pushingForward=this.dir>0;}
}
class UIManager{constructor(gm){this.gm=gm}updateUI(){document.getElementById('stats').innerHTML=`<div>分数：${this.gm.score}</div><div>剩余硬币：${this.gm.remainingCoins}</div><div>场上硬币：${this.gm.coins.length}</div><div>Debug：${this.gm.debug?'开':'关'}</div>`}}

class GameManager{
  constructor(){this.canvas=document.getElementById('gameCanvas');this.ctx=this.canvas.getContext('2d');this.keys={};this.score=0;this.remainingCoins=120;this.debug=true;this.coins=[];this.floatTexts=[];
    this.board={xMin:-1,xMax:1,yMin:0,yMax:1,collectLine:0.88};
    this.cam={cx:this.canvas.width/2,topY:120,bottomY:545,backW:370,frontW:830};
    this.spawner=new CoinSpawner(this);this.pusher=new Pusher(this);this.ui=new UIManager(this);this.setupInput();this.updateUI();}
  canDrop(){return this.remainingCoins>0}
  startGame(){this.running=true;requestAnimationFrame(t=>this.loop(t))}
  worldToScreen(x,y){const t=Math.max(0,Math.min(1,y));const w=this.cam.backW+(this.cam.frontW-this.cam.backW)*t;const sx=this.cam.cx + x*(w/2);const sy=this.cam.topY + t*(this.cam.bottomY-this.cam.topY);const scale=.58+t*.72;return {x:sx,y:sy,scale,width:w}}
  addScore(v,coin){this.score+=v;this.floatTexts.push({x:coin.x,y:coin.y-0.03,text:`+${v}`,life:1});console.log('coin collected',coin);console.log('score updated',v);console.log('current score',this.score);this.updateUI()}
  collectCoin(coin){if(coin.collected)return;coin.collected=true;this.addScore(coin.value,coin)}
  updateUI(){this.ui.updateUI()}
  setupInput(){this.canvas.addEventListener('mousemove',e=>{const r=this.canvas.getBoundingClientRect();const nx=(e.clientX-r.left)/r.width;this.spawner.x=(nx-0.5)*1.7});this.canvas.addEventListener('click',()=>this.spawner.drop());window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k===' ')this.spawner.drop();if(k==='d')this.debug=!this.debug;});}

  resolveCoinCollisions(){for(let i=0;i<this.coins.length;i++){for(let j=i+1;j<this.coins.length;j++){const a=this.coins[i],b=this.coins[j];const dx=b.x-a.x,dy=b.y-a.y;const d=Math.hypot(dx,dy);const min=(a.radius+b.radius)/170;if(d>0&&d<min){const nx=dx/d,ny=dy/d;const overlap=min-d;a.x-=nx*overlap*.5;b.x+=nx*overlap*.5;a.y-=ny*overlap*.5;b.y+=ny*overlap*.5;const push=14;a.vx-=nx*push;b.vx+=nx*push;a.vy-=ny*push;b.vy+=ny*push;}}}}

  updateCoins(dt){
    const friction=0.985;
    for(const c of this.coins){
      if(this.pusher.pushingForward){const inBand=c.y>this.pusher.y-0.028&&c.y<this.pusher.y+0.036&&Math.abs(c.x)<this.pusher.contactWidth; if(inBand)c.vy+=this.pusher.pushForce*dt;}
      c.vy+=16*dt; c.x+=c.vx*dt; c.y+=c.vy*dt; c.vx*=friction; c.vy*=0.992;
      if(c.x<this.board.xMin+0.05){c.x=this.board.xMin+0.05;c.vx=Math.abs(c.vx)*0.3}
      if(c.x>this.board.xMax-0.05){c.x=this.board.xMax-0.05;c.vx=-Math.abs(c.vx)*0.3}
      if(c.y<0.02){c.y=0.02;c.vy=0}
      if(c.y>this.board.collectLine && !c.collected){this.collectCoin(c)}
    }
    this.resolveCoinCollisions();
    this.coins=this.coins.filter(c=>!c.collected && c.y<1.15);
  }

  updateFloatTexts(dt){for(const f of this.floatTexts){f.life-=dt;f.y-=0.22*dt}this.floatTexts=this.floatTexts.filter(f=>f.life>0)}

  drawMachine(){const ctx=this.ctx;ctx.clearRect(0,0,this.canvas.width,this.canvas.height);
    ctx.fillStyle='#0f1a2c';ctx.fillRect(0,0,this.canvas.width,this.canvas.height);
    const backL=this.worldToScreen(-1,0),backR=this.worldToScreen(1,0),frontL=this.worldToScreen(-1,1),frontR=this.worldToScreen(1,1);
    ctx.fillStyle='#111b2d';ctx.beginPath();ctx.moveTo(backL.x,backL.y);ctx.lineTo(backR.x,backR.y);ctx.lineTo(frontR.x,frontR.y);ctx.lineTo(frontL.x,frontL.y);ctx.closePath();ctx.fill();
    const grd=ctx.createLinearGradient(0,backL.y,0,frontL.y);grd.addColorStop(0,'#3b485f');grd.addColorStop(0.6,'#586883');grd.addColorStop(1,'#6a7a95');ctx.fillStyle=grd;
    ctx.beginPath();ctx.moveTo(backL.x+14,backL.y+10);ctx.lineTo(backR.x-14,backR.y+10);ctx.lineTo(frontR.x-16,frontR.y-38);ctx.lineTo(frontL.x+16,frontL.y-38);ctx.closePath();ctx.fill();
    const cl=this.worldToScreen(-1,this.board.collectLine),cr=this.worldToScreen(1,this.board.collectLine),fl=this.worldToScreen(-1,1),fr=this.worldToScreen(1,1);
    ctx.fillStyle='#0b0d13';ctx.beginPath();ctx.moveTo(cl.x+10,cl.y+2);ctx.lineTo(cr.x-10,cr.y+2);ctx.lineTo(fr.x-26,fr.y-6);ctx.lineTo(fl.x+26,fl.y-6);ctx.closePath();ctx.fill();
    // machine frame/glass
    ctx.strokeStyle='#8bd5ff55';ctx.lineWidth=4;ctx.strokeRect(backL.x-36,backL.y-58,(backR.x-backL.x)+72,(frontL.y-backL.y)+128);
    ctx.fillStyle='#9ee7ff10';ctx.fillRect(backL.x-32,backL.y-54,(backR.x-backL.x)+64,(frontL.y-backL.y)+120);
  }

  drawPusher(){const ctx=this.ctx;const y=this.pusher.y;const l=this.worldToScreen(-0.92,y),r=this.worldToScreen(0.92,y),l2=this.worldToScreen(-0.92,y+0.05),r2=this.worldToScreen(0.92,y+0.05);
    ctx.fillStyle=this.pusher.pushingForward?'#9fb6d4':'#70849e';ctx.beginPath();ctx.moveTo(l.x,l.y);ctx.lineTo(r.x,r.y);ctx.lineTo(r2.x,r2.y);ctx.lineTo(l2.x,l2.y);ctx.closePath();ctx.fill();
    ctx.fillStyle='#485b75';ctx.beginPath();ctx.moveTo(l.x,l.y-10);ctx.lineTo(r.x,r.y-10);ctx.lineTo(r.x,r.y);ctx.lineTo(l.x,l.y);ctx.closePath();ctx.fill();
  }

  drawCoins(){const arr=[...this.coins].sort((a,b)=>a.y-b.y);for(const c of arr){const p=this.worldToScreen(c.x,c.y),r=c.radius*p.scale;
    const ctx=this.ctx;ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(p.x,p.y+r*0.72,r*0.95,r*0.34,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#c27f19';ctx.beginPath();ctx.ellipse(p.x,p.y+r*0.2,r,r*0.34,0,0,Math.PI*2);ctx.fill();
    const g=ctx.createRadialGradient(p.x-r*0.25,p.y-r*0.35,r*0.2,p.x,p.y-r*0.2,r*1.1);g.addColorStop(0,'#fff6bc');g.addColorStop(1,'#e3a72a');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(p.x,p.y-r*0.15,r,r*0.8,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#f7d06a';ctx.lineWidth=2*p.scale;ctx.beginPath();ctx.ellipse(p.x,p.y-r*0.15,r*0.75,r*0.55,0,0,Math.PI*2);ctx.stroke();
  }}

  drawSpawner(){const p=this.worldToScreen(this.spawner.x,0.01);const ctx=this.ctx;ctx.fillStyle='#83d9ff';ctx.fillRect(p.x-16,p.y-46,32,40);ctx.fillStyle='#1d2f45';ctx.fillRect(p.x-20,p.y-8,40,14)}
  drawDebug(){if(!this.debug)return;const ctx=this.ctx;ctx.strokeStyle='#00ffcc';ctx.lineWidth=1;const b1=this.worldToScreen(-1,0),b2=this.worldToScreen(1,0),f1=this.worldToScreen(-1,1),f2=this.worldToScreen(1,1);ctx.beginPath();ctx.moveTo(b1.x,b1.y);ctx.lineTo(b2.x,b2.y);ctx.lineTo(f2.x,f2.y);ctx.lineTo(f1.x,f1.y);ctx.closePath();ctx.stroke();const c1=this.worldToScreen(-1,this.board.collectLine),c2=this.worldToScreen(1,this.board.collectLine);ctx.strokeStyle='#ff4f7a';ctx.beginPath();ctx.moveTo(c1.x,c1.y);ctx.lineTo(c2.x,c2.y);ctx.stroke();ctx.fillStyle='#fff';ctx.fillText(`coins:${this.coins.length}`,16,20)}
  drawFloatTexts(){const ctx=this.ctx;for(const f of this.floatTexts){const p=this.worldToScreen(f.x,f.y);ctx.globalAlpha=Math.max(0,f.life);ctx.fillStyle='#8cff80';ctx.font='bold 18px Arial';ctx.fillText(f.text,p.x-12,p.y);ctx.globalAlpha=1}}

  update(dt){this.pusher.update(dt);this.updateCoins(dt);this.updateFloatTexts(dt)}
  draw(){this.drawMachine();this.drawPusher();this.drawCoins();this.drawSpawner();this.drawFloatTexts();this.drawDebug()}
  loop(ts){if(!this.last)this.last=ts;const dt=Math.min((ts-this.last)/1000,0.033);this.last=ts;this.update(dt);this.draw();requestAnimationFrame(t=>this.loop(t))}
}

let gm;function show(id){for(const s of document.querySelectorAll('.screen'))s.classList.remove('active');document.getElementById(id).classList.add('active')}
document.getElementById('startBtn').onclick=()=>{show('gameScreen');gm=new GameManager();gm.startGame()}
</script>
</body></html>
